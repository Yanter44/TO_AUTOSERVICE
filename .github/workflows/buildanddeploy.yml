name: Build and Deploy

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v3
        
      # 2. Создание appsettings.json
      - name: Create appsettings.json
        run: |
          cat > ToMainApi/appsettings.json << 'EOF'
          {
            "Logging": {
              "LogLevel": {
                "Default": "Information",
                "Microsoft.AspNetCore": "Warning"
              }
            },
            "AdminAccount": {
              "Email": "${{ secrets.ADMINACCOUNTEMAIL }}",
              "Password": "${{ secrets.ADMINACCOUNTPASSWORD }}",
              "FIO": "${{ secrets.ADMINACCOUNTFIO }}",
              "RoleType": "${{secrets.ADMINACCOUNTROLETYPE}}"
            },
            "Jwt": {
              "Key": "${{ secrets.JWTKEY }}",
              "Issuer": "${{ secrets.JWTISSUER }}",
              "Audience": "${{ secrets.JWTAUDIENCE }}"
            },
            "AesEncryption": {
              "Key": "${{ secrets.AESENCRYPTIONKEY }}"
            },
            "ToServiceDb": {
              "ConnectionString": "${{ secrets.TOSERVICEDBCONNECTIONSTRING }}"
            },
            "Redis": {
              "ConnectionString": "${{ secrets.REDISCONNECTIONSTRING }}"
            },
            "CloudinaryService": {
              "Cloud": "${{ secrets.CLOUDINARYSERVICECLOUD }}",
              "ApiKey": "${{ secrets.CLOUDINARYSERVICEAPIKEY }}",
              "ApiSecret": "${{ secrets.CLOUDINARYSERVICEAPISECRET }}"
            },
            "MailerSend": {
              "ApiKey": "${{ secrets.MAILERSENDAPIKEY }}",
              "FromEmail": "${{ secrets.MAILERSENDFROMEMAIL }}"
            },
            "ReveAi": {
              "ApiKey": "${{ secrets.REVEAIAPIKEY }}"
            },
            "NanoBanana": {
              "ApiKey": "${{ secrets.NANOBANANAAPIKEY }}"
            },
            "AllowedHosts": "*"
          }
          EOF
        
      # 2. Логин в Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Сборка и пуш API
      - name: Build and push API
        run: |
          docker build -f ToMainApi/Dockerfile -t yanterbrown/toautoservice-api:latest ToMainApi/
          docker push yanterbrown/toautoservice-api:latest
          
      # 4. Деплой контейнеров на сервер
      - name: Deploy containers to server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /var/www/toautoserviceprojectdocker
            docker-compose pull
            docker-compose up -d
